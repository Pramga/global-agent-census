
name: Test Census Agent Importer

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-import:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: python -m py_compile service.py
      - name: Test importer in temporary database
        env:
          DATABASE_PATH: ${{ runner.temp }}/import-test.sqlite3
        run: |
          python import_agents.py

          python - <<'PY'
          import json
          import os
          import sqlite3
          from pathlib import Path

          export = json.loads(
              Path("public/agents.json").read_text(
                  encoding="utf-8"
              )
          )

          conn = sqlite3.connect(
              os.environ["DATABASE_PATH"]
          )
          try:
              count = conn.execute(
                  "SELECT COUNT(*) FROM agents"
              ).fetchone()[0]

              print(f"Exported records: {len(export)}")
              print(f"Imported records: {count}")

              assert count > 0
              assert count == len(export)

              from import_agents import import_agents

              import_agents()

              count_after_second_import = conn.execute(
                  "SELECT COUNT(*) FROM agents"
              ).fetchone()[0]

              assert count_after_second_import == count, (
                  "Repeated import changed the agent count"
              )

              print("REPEAT IMPORT TEST PASSED")
              
              agent_id = conn.execute(
                  "SELECT agent_id FROM agents LIMIT 1"
              ).fetchone()[0]

              newer_timestamp = "2099-01-01T00:00:00Z"
              newer_name = "Protected Newer Record"

              conn.execute(
                  """
                  UPDATE agents
                  SET last_seen_at = ?,
                      display_name = ?
                  WHERE agent_id = ?
                  """,
                  (newer_timestamp, newer_name, agent_id),
              )
              conn.commit()

              import_agents()

              saved = conn.execute(
                  """
                  SELECT last_seen_at, display_name
                  FROM agents
                  WHERE agent_id = ?
                  """,
                  (agent_id,),
              ).fetchone()

              assert saved == (
                  newer_timestamp, newer_name
              ), "Newer agent record was overwritten"

              print("TIMESTAMP PROTECTION TEST PASSED")

              print("IMPORT TEST PASSED")
          finally:
              conn.close()
          PY
