name: Update Global AI Agent Census

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-census:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Restore census database
        uses: actions/cache/restore@v4
        with:
          path: census.sqlite3
          key: census-db-${{ github.run_id }}
          restore-keys: |
            census-db-
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run census updater
        env:
          GLAMA_API_KEY: ${{ secrets.GLAMA_API_KEY }}
        run: python census.py
      - name: Save census database
        uses: actions/cache/save@v4
        with:
          path: census.sqlite3
          key: census-db-${{ github.run_id }}
      - name: Save updated census data
        run: |
          git config user.name "global-agent-census-bot"
          git config user.email "actions@users.noreply.github.com"

          mkdir -p /tmp/census-output
          cp public/agents.csv /tmp/census-output/agents.csv
          cp public/agents.json /tmp/census-output/agents.json
          cp public/counts.json /tmp/census-output/counts.json
          cp public/run_report.json /tmp/census-output/run_report.json

          git fetch origin main
          git reset --hard origin/main

          cp /tmp/census-output/agents.csv public/agents.csv
          cp /tmp/census-output/agents.json public/agents.json
          cp /tmp/census-output/counts.json public/counts.json
          cp /tmp/census-output/run_report.json public/run_report.json

          git add public/agents.csv public/agents.json public/counts.json public/run_report.json

          if git diff --cached --quiet; then
            echo "No census changes found."
          else
            git commit -m "Automated census update"
            git push origin main
          fi