name: Update Global AI Agent Census

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-census:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Restore census database
        uses: actions/cache/restore@v4
        with:
          path: census.sqlite3
          key: census-db-${{ github.run_id }}
          restore-keys: |
            census-db-
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run census updater
        run: python census.py
      - name: Save census database
        uses: actions/cache/save@v4
        with:
          path: census.sqlite3
          key: census-db-${{ github.run_id }}
      - name: Save updated census data
        run: |
          git config user.name "global-agent-census-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/agents.csv public/agents.json public/counts.json public/run_report.json
          if git diff --cached --quiet; then
            echo "No census changes found."
          else
            git commit -m "Automated census update"
            git pull --rebase origin main
            git push
          fi